name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          # Assume we clone/pull the repo in a directory named 'anavandi'
          if [ ! -d "anavandi" ]; then
            git clone https://github.com/callmesidhu/FastAPI-CivicLens-hackathon.git anavandi
          fi
          
          cd anavandi
          git fetch --all
          git checkout production
          git pull origin production
          
          # Optional: Write the .env.production file from a GitHub secret
          # echo "${{ secrets.PROD_ENV_FILE }}" > .env.production
          
          # Rebuild and restart the containers
          docker-compose build
          docker-compose up -d
        EOF
