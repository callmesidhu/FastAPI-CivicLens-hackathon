version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: civiclens_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civiclens_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civiclens_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
