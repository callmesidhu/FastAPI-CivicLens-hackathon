version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: civiclens_mongodb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - civiclens_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civiclens_backend
    env_file:
      - .env.production
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped
    networks:
      - civiclens_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civiclens_frontend
    env_file:
      - .env.production
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - civiclens_network

  nginx:
    image: nginx:alpine
    container_name: civiclens_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - civiclens_network

networks:
  civiclens_network:

volumes:
  mongodb_data:
